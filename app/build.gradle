plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sbbey.motionphoto'
    compileSdk 34

    defaultConfig {
        applicationId "com.sbbey.motionphoto"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5.0"
    }

    signingConfigs {
        release {
            storeFile file("keystore/release.keystore")
            storePassword System.getenv("KEYSTORE_PASS") ?: "motionphoto2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "motionphoto"
            keyPassword System.getenv("KEY_PASS") ?: "motionphoto2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
